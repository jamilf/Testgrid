<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bright Spark Aptitude Simulator</title>
  <style>
:root {
  --bg:#f4f6f8; --surface:#fff; --surface-2:#f8fafc; --ink:#0f172a; --muted:#64748b;
  --accent:#1d4ed8; --accent-soft:#eff6ff; --border:#e2e8f0;
  --correct:#16a34a; --correct-soft:#f0fdf4; --incorrect:#dc2626; --incorrect-soft:#fef2f2;
  --flagged:#d97706; --warn-soft:#fffbeb; --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 4px 12px rgba(15,23,42,.10);
  /* legacy aliases kept for any inline references */
  --text:var(--ink);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
       background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.6; }
.screen { min-height: 100vh; padding: 1rem; }
.container { max-width: 760px; margin: 0 auto; }

/* ---- Top nav ---- */
#topnav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center;
          justify-content: space-between; gap: 0.5rem; padding: 0.6rem 1rem;
          background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); }
.nav-brand { font-weight: 800; font-size: 1.1rem; color: var(--ink); display: flex; align-items: center; gap: 0.35rem; }
.nav-links { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.nav-btn { display: inline-block; padding: 0.45rem 0.85rem; border-radius: var(--radius-sm);
           border: 1px solid transparent; background: transparent; color: var(--muted);
           cursor: pointer; font-size: 0.9rem; font-weight: 600; text-decoration: none;
           transition: background 0.15s, color 0.15s, transform 0.1s; }
.nav-btn:hover { background: var(--accent-soft); color: var(--accent); transform: translateY(-1px); }
.nav-btn.nav-cta { background: var(--accent); color: #fff; }
.nav-btn.nav-cta:hover { background: #1740b8; color: #fff; }
.nav-btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; }

.btn { display: inline-flex; align-items: center; justify-content: center;
       padding: 0.75rem 1.5rem; border-radius: var(--radius-sm);
       border: none; cursor: pointer; font-size: 1rem; font-weight: 600; min-height: 44px;
       transition: transform 0.1s, box-shadow 0.15s, background 0.15s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--surface); border: 2px solid var(--border); color: var(--ink); }
.btn-danger { background: var(--incorrect); color: #fff; }

.option-btn { display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left;
              padding: 0.85rem 1.2rem; margin-bottom: 0.5rem; min-height: 44px;
              border: 2px solid var(--border); border-radius: var(--radius-sm);
              background: var(--surface); cursor: pointer; font-size: 1rem; color: var(--ink);
              transition: border-color 0.15s, background 0.15s, transform 0.1s; }
.option-btn:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.option-btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; }
.option-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
.option-btn.correct { border-color: var(--correct); background: var(--correct-soft); }
.option-btn.incorrect { border-color: var(--incorrect); background: var(--incorrect-soft); }
.option-btn:disabled { cursor: default; }
.opt-badge { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 6px;
             background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
             display: inline-flex; align-items: center; justify-content: center;
             font-weight: 700; font-size: 0.85rem; }
.option-btn.selected .opt-badge { background: var(--accent); color: #fff; border-color: var(--accent); }
.option-btn.correct .opt-badge { background: var(--correct); color: #fff; border-color: var(--correct); }
.option-btn.incorrect .opt-badge { background: var(--incorrect); color: #fff; border-color: var(--incorrect); }
.opt-text { flex: 1 1 auto; }
.opt-icon { flex: 0 0 auto; font-weight: 700; }
.option-btn.correct .opt-icon { color: var(--correct); }
.option-btn.incorrect .opt-icon { color: var(--incorrect); }

.timer { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.urgent { color: var(--incorrect); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }
.progress-bar { height: 8px; background: var(--border); border-radius: 4px; margin: 0.5rem 0; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s; }
.progress-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
.grid-cell { width: 2.5rem; height: 2.5rem; border-radius: 6px; border: 2px solid var(--border);
             cursor: pointer; font-weight: 700; font-size: 0.85rem; background: var(--surface);
             transition: transform 0.1s; }
.grid-cell:hover { transform: translateY(-1px); }
.grid-cell.correct { background: var(--correct); color: #fff; border-color: var(--correct); }
.grid-cell.incorrect { background: var(--incorrect); color: #fff; border-color: var(--incorrect); }
.grid-cell.unanswered { background: #e5e7eb; }
.grid-cell.flagged { outline: 3px solid var(--flagged); outline-offset: 1px; }
.feedback-box { margin-top: 1rem; padding: 1rem; border-radius: var(--radius);
                border-left: 4px solid var(--correct); background: var(--correct-soft); box-shadow: var(--shadow); }
.feedback-box.wrong { border-color: var(--incorrect); background: var(--incorrect-soft); }
.hint-box { margin-top: 0.75rem; padding: 0.85rem 1rem; border-radius: var(--radius);
            border-left: 4px solid var(--flagged); background: var(--warn-soft); }
.hint-btn { background: var(--warn-soft); border: 2px solid #fcd34d; color: #92400e;
            border-radius: var(--radius-sm); padding: 0.5rem 1rem; cursor: pointer; font-weight: 600;
            font-size: 0.9rem; margin-top: 0.75rem; transition: transform 0.1s; }
.hint-btn:hover { transform: translateY(-1px); }
.mistake-line { margin-top: 0.5rem; color: #92400e; font-size: 0.92rem; }
.solution-card { background: var(--surface); border-radius: var(--radius);
                 border: 1px solid var(--border); padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
.solution-card.correct { border-left: 4px solid var(--correct); }
.solution-card.incorrect { border-left: 4px solid var(--incorrect); }
.score-card { background: var(--surface); border-radius: var(--radius); padding: 1.25rem;
              border: 1px solid var(--border); margin-bottom: 1rem; box-shadow: var(--shadow); }
.band-strong { color: var(--correct); font-weight: 700; }
.band-solid { color: var(--accent); font-weight: 700; }
.band-low { color: var(--incorrect); font-weight: 700; }
svg text { font-family: -apple-system, sans-serif; }
.abs-options-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
.abs-option-btn { border: 2px solid var(--border); border-radius: var(--radius-sm);
                  background: var(--surface); cursor: pointer; padding: 4px 4px 2px;
                  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
                  min-width: 90px; min-height: 96px; transition: border-color 0.15s, transform 0.1s; }
.abs-option-btn:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.abs-option-btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; }
.abs-option-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
.abs-option-btn.correct { border-color: var(--correct); background: var(--correct-soft); }
.abs-option-btn.incorrect { border-color: var(--incorrect); background: var(--incorrect-soft); }
.abs-option-btn:disabled { cursor: default; }
.abs-badge { font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-top: 2px; }
.abs-option-btn.selected .abs-badge { color: var(--accent); }
.abs-option-btn.correct .abs-badge { color: var(--correct); }
.abs-option-btn.incorrect .abs-badge { color: var(--incorrect); }
.seq-display { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.seq-item { text-align: center; }
.seq-label { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.question-header { display: flex; justify-content: space-between; align-items: center;
                   padding: 0.85rem 1rem; background: var(--surface); border-bottom: 1px solid var(--border);
                   position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow); }
.module-label { font-weight: 700; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.q-counter { font-weight: 600; }
.nav-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
.flag-btn { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-sm);
            padding: 0.5rem 1rem; cursor: pointer; font-size: 0.9rem; font-weight: 600; min-height: 44px; }
.flag-btn.flagged { border-color: var(--flagged); color: var(--flagged); background: var(--warn-soft); }
.home-card { background: var(--surface); border-radius: var(--radius); padding: 1.5rem;
             border: 1px solid var(--border); margin-bottom: 1rem; box-shadow: var(--shadow); }
.module-select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 1rem 0; }
.module-toggle { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1rem;
                 border: 2px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
                 background: var(--surface); font-weight: 600; transition: border-color 0.15s, background 0.15s; }
.module-toggle.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.mode-row { display: flex; gap: 1rem; margin: 1rem 0; }
.mode-btn { flex: 1; padding: 0.75rem; border: 2px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface); cursor: pointer; font-weight: 600; text-align: center; }
.mode-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.review-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 1rem 0; }
.section-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.75rem; }
.results-overall { background: var(--accent); color: #fff; border-radius: var(--radius);
                   padding: 1.5rem; text-align: center; margin-bottom: 1.5rem; box-shadow: var(--shadow-lg); }
.results-overall h2 { font-size: 2rem; }
.tag { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px;
       font-size: 0.8rem; font-weight: 700; background: #e5e7eb; color: var(--ink); }
.tag.correct { background: #dcfce7; color: var(--correct); }
.tag.incorrect { background: #fee2e2; color: var(--incorrect); }
hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
p { margin-bottom: 0.5rem; line-height: 1.6; }
h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; line-height: 1.25; }
h2 { font-size: 1.45rem; font-weight: 700; margin-bottom: 0.5rem; line-height: 1.3; }
h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem; line-height: 1.35; }
table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; font-size: 0.95rem; }
th, td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; }
th { background: var(--surface-2); font-weight: 700; }
.checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.5rem 0; cursor: pointer; }
.solutions-section { margin-top: 2rem; }
.inline-error { color: var(--incorrect); font-weight: 600; font-size: 0.9rem; margin-top: 0.5rem; }
/* Study guide */
.study-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                 margin-bottom: 0.85rem; box-shadow: var(--shadow); overflow: hidden; }
.study-section > summary { cursor: pointer; list-style: none; padding: 1rem 1.25rem; font-weight: 700;
                          font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; }
.study-section > summary::-webkit-details-marker { display: none; }
.study-section > summary::after { content: '+'; margin-left: auto; color: var(--muted); font-weight: 700; }
.study-section[open] > summary::after { content: '–'; }
.study-body { padding: 0 1.25rem 1.25rem; }
.study-body ul { margin: 0.5rem 0 0.5rem 1.25rem; }
.study-body li { margin-bottom: 0.35rem; line-height: 1.55; }
.study-body code { background: var(--surface-2); padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.9em; }
.eg { color: var(--accent); font-weight: 600; }
/* Progress */
.spark-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
             padding: 0.75rem 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.spark-row:last-child { border-bottom: none; }
.empty-state { text-align: center; color: var(--muted); padding: 2rem 1rem; }
@media (max-width: 560px) {
  .timer { font-size: 1.2rem; }
  .option-btn { font-size: 0.95rem; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.25rem; }
  .module-select-grid { grid-template-columns: 1fr; }
  .mode-row { flex-direction: column; gap: 0.5rem; }
  #topnav { padding: 0.5rem 0.75rem; }
  .nav-brand { font-size: 1rem; }
  .nav-btn { padding: 0.4rem 0.6rem; font-size: 0.82rem; }
  .study-section > summary { font-size: 1rem; padding: 0.85rem 1rem; }
  .study-body { padding: 0 1rem 1rem; }
}
  </style>
</head>

  <nav id="topnav">
    <div class="nav-brand">⚡ Bright Spark</div>
    <div class="nav-links">
      <button class="nav-btn" onclick="renderHome();showScreen('screen-home')">Home</button>
      <button class="nav-btn" onclick="renderStudy();showScreen('screen-study')">Study Guide</button>
      <button class="nav-btn" onclick="renderProgress();showScreen('screen-progress')">Progress</button>
      <a class="nav-btn nav-cta" href="interview.html">Interview Prep</a>
    </div>
  </nav>
  <div id="screen-home" class="screen"></div>
  <div id="screen-question" class="screen" style="display:none"></div>
  <div id="screen-review" class="screen" style="display:none"></div>
  <div id="screen-results" class="screen" style="display:none"></div>
  <div id="screen-study" class="screen" style="display:none"></div>
  <div id="screen-progress" class="screen" style="display:none"></div>

<script>
// ============================================================
// SECTION 1: DATA / GENERATORS
// ============================================================

function lcg(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 0x100000000; };
}

function makeDistractors(correctVal, errorFns, fmt) {
  const wrongs = [];
  for (const fn of errorFns) {
    const w = fn();
    if (w !== correctVal && !wrongs.includes(w)) wrongs.push(w);
    if (wrongs.length === 3) break;
  }
  while (wrongs.length < 3) {
    let candidate = correctVal + wrongs.length + 1;
    while (wrongs.includes(candidate) || candidate === correctVal) candidate++;
    wrongs.push(candidate);
  }
  const pool = [correctVal, ...wrongs].map(v => fmt ? fmt(v) : String(v));
  let ci = 0;
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
    if (j === ci) ci = i; else if (i === ci) ci = j;
  }
  return { options: pool, correct: ci };
}

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function lcmVal(a, b) { return (a * b) / gcd(a, b); }
function simplifyFrac(n, d) { const g = gcd(Math.abs(n), Math.abs(d)); return [n/g, d/g]; }
function fracStr(n, d) { const [sn, sd] = simplifyFrac(n, d); return sd === 1 ? String(sn) : `${sn}/${sd}`; }

// ---- 1C. Numeracy Generators ----

function genArithmetic(idx, rng) {
  const ops = ['+', '-', '×', '÷'];
  const op = ops[Math.floor(rng() * 4)];
  let a, b, correct, explanation;
  if (op === '+') {
    a = Math.floor(rng() * 90) + 10;
    b = Math.floor(rng() * 90) + 10;
    correct = a + b;
    explanation = `${a} + ${b} = ${correct}`;
  } else if (op === '-') {
    b = Math.floor(rng() * 90) + 10;
    a = b + Math.floor(rng() * 90) + 10;
    correct = a - b;
    explanation = `${a} - ${b} = ${correct}`;
  } else if (op === '×') {
    a = Math.floor(rng() * 11) + 2;
    b = Math.floor(rng() * 11) + 2;
    correct = a * b;
    explanation = `${a} × ${b} = ${correct}`;
  } else {
    b = Math.floor(rng() * 11) + 2;
    const q = Math.floor(rng() * 11) + 2;
    a = b * q;
    correct = q;
    explanation = `${a} ÷ ${b} = ${correct}`;
  }
  const errFns = op === '+' || op === '-'
    ? [() => a - b, () => a + b + 1, () => correct + 10]
    : op === '×'
      ? [() => a + b, () => a - b, () => correct + a]
      : [() => a * b, () => b, () => correct + 1];
  const { options, correct: ci } = makeDistractors(correct, errFns, String);
  return {
    id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
    prompt: `<p>Calculate: <strong>${a} ${op} ${b}</strong></p>`,
    options, correct: ci,
    explanation: `<p><strong>Step 1:</strong> Identify the operation (${op}).</p><p><strong>Step 2:</strong> ${explanation}.</p>`,
    hint: "Work left to right; mind the operation.",
    commonMistake: "A common slip is applying the wrong operation, or making a place-value error when carrying or borrowing.",
    svg: null
  };
}

function genFraction(idx, rng) {
  const denoms = [2,3,4,5,6,8,10];
  const d1 = denoms[Math.floor(rng() * denoms.length)];
  let d2 = denoms[Math.floor(rng() * denoms.length)];
  while (d2 === d1) d2 = denoms[Math.floor(rng() * denoms.length)];
  const n1 = Math.floor(rng() * (d1 - 1)) + 1;
  const n2 = Math.floor(rng() * (d2 - 1)) + 1;
  const lcd = lcmVal(d1, d2);
  const resN = n1 * (lcd / d1) + n2 * (lcd / d2);
  const ans = fracStr(resN, lcd);
  const { options, correct: ci } = makeDistractors(ans,
    [() => fracStr(n1 + n2, d1 + d2), () => fracStr(n1 * (lcd/d1) + n2 * (lcd/d2) + 1, lcd), () => fracStr(n1 * n2, d1 * d2)],
    v => v
  );
  return {
    id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
    prompt: `<p>Calculate: <strong>${n1}/${d1} + ${n2}/${d2}</strong></p>`,
    options, correct: ci,
    explanation: `<p><strong>Step 1:</strong> Find the LCD of ${d1} and ${d2}: it is ${lcd}.</p><p><strong>Step 2:</strong> Convert each fraction: ${n1}/${d1} = ${n1*(lcd/d1)}/${lcd}, and ${n2}/${d2} = ${n2*(lcd/d2)}/${lcd}.</p><p><strong>Step 3:</strong> Add the numerators: ${resN}/${lcd}, which simplifies to <strong>${ans}</strong>.</p>`,
    hint: "Convert to a common denominator (LCD) before adding.",
    commonMistake: "A common mistake is adding numerators and denominators directly (e.g. a/b + c/d = (a+c)/(b+d)) — that is not how fractions add.",
    svg: null
  };
}

function genDecimal(idx, rng) {
  const factors = [10, 100, 1000];
  const factor = factors[Math.floor(rng() * 3)];
  const isMultiply = rng() > 0.5;
  const dp = rng() > 0.5 ? 1 : 2;
  const base = Math.round((rng() * 9 + 1) * Math.pow(10, dp)) / Math.pow(10, dp);
  let a, op, correct;
  if (isMultiply) { a = base; op = '×'; correct = Math.round(a * factor * 1000) / 1000; }
  else { a = Math.round(base * factor * 100) / 100; op = '÷'; correct = Math.round(a / factor * 10000) / 10000; }
  const correctStr = String(correct);
  const { options, correct: ci } = makeDistractors(correctStr,
    [() => String(isMultiply ? a * (factor * 10) : a / (factor * 10)),
     () => String(isMultiply ? a / factor : a * factor),
     () => String(isMultiply ? a * (factor / 10) : a / (factor / 10))],
    v => v
  );
  return {
    id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
    prompt: `<p>Calculate: <strong>${a} ${op} ${factor}</strong></p>`,
    options, correct: ci,
    explanation: `<p><strong>Step 1:</strong> ${factor} is 10 to the power ${Math.log10(factor)}, so move the decimal point ${Math.log10(factor)} place(s).</p><p><strong>Step 2:</strong> Because you are ${isMultiply ? 'multiplying' : 'dividing'}, move it to the ${isMultiply ? 'right' : 'left'}: ${a} ${op} ${factor} = <strong>${correct}</strong>.</p>`,
    hint: "Count how many places to move the decimal point.",
    commonMistake: "A common slip is moving the decimal the wrong direction, or by the wrong number of places (e.g. one place for ×100 instead of two).",
    svg: null
  };
}

function genPercentage(idx, rng) {
  const subtype = Math.floor(rng() * 3);
  let prompt, correct, explanation, errFns;
  if (subtype === 0) {
    const pcts = [5,10,15,20,25,30,40,50,75];
    const pct = pcts[Math.floor(rng() * pcts.length)];
    const base = (Math.floor(rng() * 9) + 2) * 10;
    correct = Math.round(pct / 100 * base);
    prompt = `<p>What is <strong>${pct}%</strong> of <strong>${base}</strong>?</p>`;
    explanation = `<p>${pct}% of ${base} = (${pct} ÷ 100) × ${base} = <strong>${correct}</strong></p>`;
    errFns = [() => Math.round(pct * base), () => Math.round(pct / 100 * base) + 10, () => Math.round((100 - pct) / 100 * base)];
  } else if (subtype === 1) {
    const base = (Math.floor(rng() * 9) + 2) * 10;
    const divisors = [2,4,5,10,20,25,50];
    const div = divisors[Math.floor(rng() * divisors.length)];
    const x = Math.round(base / div);
    correct = Math.round((x / base) * 100);
    prompt = `<p><strong>${x}</strong> is what percentage of <strong>${base}</strong>?</p>`;
    explanation = `<p>(${x} ÷ ${base}) × 100 = <strong>${correct}%</strong></p>`;
    errFns = [() => Math.round((base / x) * 100), () => correct + 10, () => Math.round(x * base / 100)];
  } else {
    const pcts = [5,10,15,20,25,30];
    const pct = pcts[Math.floor(rng() * pcts.length)];
    const base = (Math.floor(rng() * 9) + 2) * 10;
    const increase = rng() > 0.5;
    const change = Math.round(pct / 100 * base);
    correct = increase ? base + change : base - change;
    prompt = `<p>${increase ? 'Increase' : 'Decrease'} <strong>${base}</strong> by <strong>${pct}%</strong>.</p>`;
    explanation = `<p>${pct}% of ${base} = ${change}. ${base} ${increase ? '+' : '-'} ${change} = <strong>${correct}</strong></p>`;
    errFns = [() => base + (increase ? -change : change), () => correct + 5, () => Math.round(base * (1 + pct / 100 * (increase ? -1 : 1)))];
  }
  const { options, correct: ci } = makeDistractors(correct, errFns, String);
  return {
    id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
    prompt, options, correct: ci, explanation,
    hint: "Per cent means 'out of 100' — divide by 100 first.",
    commonMistake: "A common slip is multiplying by the per cent instead of dividing by 100 first (e.g. treating 20% as ×20 rather than ×0.2).",
    svg: null
  };
}

function genRatio(idx, rng) {
  const a = Math.floor(rng() * 7) + 2;
  let b = Math.floor(rng() * 7) + 2;
  while (b === a) b = Math.floor(rng() * 7) + 2;
  const k = Math.floor(rng() * 10) + 3;
  const T = (a + b) * k;
  const aShare = a * k;
  const { options, correct: ci } = makeDistractors(aShare,
    [() => Math.round(T / a), () => Math.round(b / (a + b) * T), () => T - aShare + 1],
    String
  );
  return {
    id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
    prompt: `<p>A and B share in the ratio <strong>${a}:${b}</strong>. The total is <strong>${T}</strong>. How much does A receive?</p>`,
    options, correct: ci,
    explanation: `<p><strong>Step 1:</strong> Add the ratio parts: ${a} + ${b} = ${a+b}.</p><p><strong>Step 2:</strong> Find one part: ${T} ÷ ${a+b} = ${k}.</p><p><strong>Step 3:</strong> A's share = ${a} × ${k} = <strong>${aShare}</strong>.</p>`,
    hint: "Add the ratio parts to find the value of one part.",
    commonMistake: "Dividing the total by one side's number ignores the other parts — you must divide by the SUM of the parts first.",
    svg: null
  };
}

function genUnitConversion(idx, rng) {
  const conversions = [
    { from: 'km', to: 'm', factor: 1000, dir: 'multiply' },
    { from: 'm', to: 'km', factor: 1000, dir: 'divide' },
    { from: 'kg', to: 'g', factor: 1000, dir: 'multiply' },
    { from: 'g', to: 'kg', factor: 1000, dir: 'divide' },
    { from: 'hours', to: 'minutes', factor: 60, dir: 'multiply' },
    { from: 'L', to: 'mL', factor: 1000, dir: 'multiply' },
    { from: 'cm', to: 'mm', factor: 10, dir: 'multiply' },
  ];
  const conv = conversions[Math.floor(rng() * conversions.length)];
  const val = Math.floor(rng() * 20) + 1;
  const correct = conv.dir === 'multiply' ? val * conv.factor : val / conv.factor;
  const correctStr = String(correct);
  const { options, correct: ci } = makeDistractors(correctStr,
    [() => String(conv.dir === 'multiply' ? val / conv.factor : val * conv.factor),
     () => String(correct * 10),
     () => String(correct / 10)],
    v => v
  );
  return {
    id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
    prompt: `<p>Convert <strong>${val} ${conv.from}</strong> to <strong>${conv.to}</strong>.</p>`,
    options, correct: ci,
    explanation: `<p><strong>Step 1:</strong> Going from ${conv.from} to ${conv.to} means you ${conv.dir === 'multiply' ? 'multiply' : 'divide'} by ${conv.factor}.</p><p><strong>Step 2:</strong> ${val} ${conv.dir === 'multiply' ? '×' : '÷'} ${conv.factor} = <strong>${correct} ${conv.to}</strong>.</p>`,
    hint: "Decide whether you multiply or divide, then by what factor.",
    commonMistake: "A common error is multiplying when you should divide (or vice-versa) — check whether you are moving to a larger or smaller unit.",
    svg: null
  };
}

function genRate(idx, rng) {
  const isSpeed = rng() > 0.5;
  let prompt, correct, explanation, errFns;
  if (isSpeed) {
    const rate = Math.floor(rng() * 50) + 20;
    const time = Math.floor(rng() * 6) + 2;
    const dist = rate * time;
    correct = time;
    prompt = `<p>An electrician lays cable at <strong>${rate} metres per hour</strong>. How many hours to lay <strong>${dist} metres</strong>?</p>`;
    explanation = `<p>Time = Distance ÷ Rate = ${dist} ÷ ${rate} = <strong>${correct} hours</strong></p>`;
    errFns = [() => dist * rate, () => correct + 1, () => Math.round(rate / dist * 10) / 10];
  } else {
    const hourly = Math.floor(rng() * 40) + 30;
    const hours = Math.floor(rng() * 8) + 2;
    correct = hourly * hours;
    prompt = `<p>A contractor charges <strong>$${hourly} per hour</strong>. A job takes <strong>${hours} hours</strong>. What is the total cost?</p>`;
    explanation = `<p>Total = $${hourly} × ${hours} hours = <strong>$${correct}</strong></p>`;
    errFns = [() => hourly + hours, () => correct + hourly, () => correct - hourly];
  }
  const { options, correct: ci } = makeDistractors(correct, errFns, v => isSpeed ? String(v) : `$${v}`);
  return {
    id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
    prompt, options, correct: ci, explanation,
    hint: "Rate = amount ÷ time. Rearrange for what's asked.",
    commonMistake: "A common slip is multiplying when you should divide (or vice-versa) — write the rate formula down and rearrange before plugging in numbers.",
    svg: null
  };
}

function genAverage(idx, rng) {
  const isFind5th = rng() > 0.5;
  let prompt, correct, explanation, errFns;
  if (isFind5th) {
    const avg = Math.floor(rng() * 30) + 20;
    const n = 5;
    const total = avg * n;
    const known = [];
    let knownSum = 0;
    for (let i = 0; i < n - 1; i++) {
      const v = Math.floor(rng() * 20) + (avg - 10);
      known.push(v);
      knownSum += v;
    }
    correct = total - knownSum;
    prompt = `<p>The average of 5 numbers is <strong>${avg}</strong>. Four of them are <strong>${known.join(', ')}</strong>. What is the fifth?</p>`;
    explanation = `<p>Total = ${avg} × 5 = ${total}. Fifth = ${total} - ${knownSum} = <strong>${correct}</strong></p>`;
    errFns = [() => correct + 5, () => Math.round(knownSum / (n-1)), () => total - knownSum + avg];
  } else {
    const count = Math.floor(rng() * 3) + 4;
    const nums = [];
    let sum = 0;
    for (let i = 0; i < count; i++) {
      const v = Math.floor(rng() * 50) + 10;
      nums.push(v);
      sum += v;
    }
    correct = Math.round(sum / count);
    prompt = `<p>What is the average of: <strong>${nums.join(', ')}</strong>?</p>`;
    explanation = `<p>Sum = ${sum}. Average = ${sum} ÷ ${count} = <strong>${correct}</strong></p>`;
    errFns = [() => Math.round(sum / (count + 1)), () => Math.round(sum / (count - 1)), () => correct + 5];
  }
  const { options, correct: ci } = makeDistractors(correct, errFns, String);
  return {
    id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
    prompt, options, correct: ci, explanation,
    hint: "Average = sum ÷ count. For a missing value, work back from the total.",
    commonMistake: "A common error is dividing by the wrong count, or forgetting that the total equals average × number of items.",
    svg: null
  };
}

function genTableQuestion(idx, rng) {
  const days = ['Monday', 'Tuesday', 'Wednesday'];
  const materials = ['Cable (m)', 'Conduit (m)', 'Connectors', 'Brackets'];
  const data = days.map(() => materials.map(() => Math.floor(rng() * 90) + 10));
  const subtype = Math.floor(rng() * 3);
  let prompt, correct, explanation, errFns;
  let tableHTML = `<table><tr><th>Day</th>${materials.map(m => `<th>${m}</th>`).join('')}</tr>`;
  data.forEach((row, ri) => {
    tableHTML += `<tr><td>${days[ri]}</td>${row.map(v => `<td>${v}</td>`).join('')}</tr>`;
  });
  tableHTML += '</table>';
  if (subtype === 0) {
    const ri = Math.floor(rng() * 3);
    correct = data[ri].reduce((a,b) => a+b, 0);
    prompt = `${tableHTML}<p>What is the total for <strong>${days[ri]}</strong>?</p>`;
    explanation = `<p>${days[ri]} total = ${data[ri].join(' + ')} = <strong>${correct}</strong></p>`;
    const otherRow = (ri + 1) % 3;
    errFns = [() => data[otherRow].reduce((a,b)=>a+b,0), () => correct - data[ri][0], () => correct + 10];
  } else if (subtype === 1) {
    const colSums = materials.map((_, ci) => data.reduce((s, row) => s + row[ci], 0));
    const maxIdx = colSums.indexOf(Math.max(...colSums));
    correct = materials[maxIdx];
    prompt = `${tableHTML}<p>Which material column has the <strong>highest total</strong>?</p>`;
    explanation = `<p>Column totals: ${materials.map((m,i) => `${m}=${colSums[i]}`).join(', ')}. Highest: <strong>${correct}</strong></p>`;
    const otherMats = materials.filter(m => m !== correct);
    const { options, correct: ci } = makeDistractors(correct,
      [() => otherMats[0], () => otherMats[1], () => otherMats[2] || otherMats[0]], v => v);
    return {
      id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
      prompt, options, correct: ci, explanation,
      hint: "Read the exact row/column the question asks for.",
      commonMistake: "A common error is reading the wrong row or column, or comparing the wrong totals.",
      svg: null
    };
  } else {
    const ri1 = 0, ri2 = 1;
    const ci = Math.floor(rng() * 4);
    correct = Math.abs(data[ri1][ci] - data[ri2][ci]);
    prompt = `${tableHTML}<p>How much more <strong>${materials[ci]}</strong> was used on <strong>${days[ri1]}</strong> than <strong>${days[ri2]}</strong>? (use absolute difference)</p>`;
    explanation = `<p>|${data[ri1][ci]} - ${data[ri2][ci]}| = <strong>${correct}</strong></p>`;
    errFns = [() => data[ri1][ci] + data[ri2][ci], () => correct + data[ri1][ci], () => correct + 5];
  }
  const { options, correct: ci2 } = makeDistractors(correct, errFns, String);
  return {
    id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
    prompt, options, correct: ci2, explanation,
    hint: "Read the exact row/column the question asks for.",
    commonMistake: "A common error is reading the wrong row or column, or adding instead of finding the difference.",
    svg: null
  };
}

function genBarChartQuestion(idx, rng) {
  const values = [1,2,3,4].map(() => Math.floor(rng() * 80) + 20);
  const maxVal = Math.max(...values);
  const chartH = 150, chartW = 300, barW = 40, gap = 15, leftPad = 40, bottomPad = 30;
  let bars = '';
  values.forEach((v, i) => {
    const bh = Math.round((v / maxVal) * chartH);
    const x = leftPad + i * (barW + gap);
    const y = chartH - bh;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="#2563eb" opacity="0.8"/>`;
    bars += `<text x="${x + barW/2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="#222">${v}</text>`;
    bars += `<text x="${x + barW/2}" y="${chartH + 15}" text-anchor="middle" font-size="10" fill="#555">Wk ${i+1}</text>`;
  });
  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 ${chartH + bottomPad + 10}" width="300" height="${chartH + bottomPad + 10}">${bars}<line x1="${leftPad}" y1="0" x2="${leftPad}" y2="${chartH}" stroke="#888" stroke-width="1"/><line x1="${leftPad}" y1="${chartH}" x2="${leftPad + 4*(barW+gap)}" y2="${chartH}" stroke="#888" stroke-width="1"/></svg>`;
  const subtype = Math.floor(rng() * 3);
  let prompt, correct, explanation, errFns;
  if (subtype === 0) {
    const maxIdx = values.indexOf(maxVal);
    correct = `Week ${maxIdx + 1}`;
    prompt = `${svgStr}<p>Which week had the <strong>highest</strong> value?</p>`;
    explanation = `<p>Values: ${values.map((v,i)=>`Week ${i+1}=${v}`).join(', ')}. Highest: <strong>${correct}</strong></p>`;
    const others = [0,1,2,3].filter(i => i !== maxIdx).map(i => `Week ${i+1}`);
    const { options, correct: ci } = makeDistractors(correct, [() => others[0], () => others[1], () => others[2]], v => v);
    return {
      id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
      prompt, options, correct: ci, explanation,
      hint: "Read each bar's value off the axis before combining.",
      commonMistake: "A common error is misreading a bar's height against the axis, or picking the tallest by eye without checking the values.",
      svg: null
    };
  } else if (subtype === 1) {
    correct = values.reduce((a,b) => a+b, 0);
    prompt = `${svgStr}<p>What is the <strong>total</strong> across all four weeks?</p>`;
    explanation = `<p>${values.join(' + ')} = <strong>${correct}</strong></p>`;
    errFns = [() => correct - values[0], () => correct + values[0], () => correct * 2];
  } else {
    const w1 = Math.floor(rng() * 4), w2 = (w1 + 1 + Math.floor(rng() * 3)) % 4;
    correct = Math.abs(values[w1] - values[w2]);
    prompt = `${svgStr}<p>How much greater was <strong>Week ${w1+1}</strong> (${values[w1]}) than <strong>Week ${w2+1}</strong> (${values[w2]})? (absolute difference)</p>`;
    explanation = `<p>|${values[w1]} - ${values[w2]}| = <strong>${correct}</strong></p>`;
    errFns = [() => values[w1] + values[w2], () => correct + 10, () => values[w1]];
  }
  const { options, correct: ci2 } = makeDistractors(correct, errFns, String);
  return {
    id: `num_${String(idx+1).padStart(2,'0')}`, module: 'numeracy', type: 'mcq',
    prompt, options, correct: ci2, explanation,
    hint: "Read each bar's value off the axis before combining.",
    commonMistake: "A common error is misreading a bar against the axis, or adding values when the question asks for a difference.",
    svg: null
  };
}

function generateNumeracyBank() {
  const seed = Date.now() ^ (Math.random() * 0xffffffff);
  const rng = lcg(seed);
  const raw = [];
  // arithmetic×2, fraction×2, decimal×2, percentage×3, ratio×2, unit×2, rate×2, average×2, table×1, bar×1 = 21
  for (let i = 0; i < 2; i++) raw.push(genArithmetic(raw.length, rng));
  for (let i = 0; i < 2; i++) raw.push(genFraction(raw.length, rng));
  for (let i = 0; i < 2; i++) raw.push(genDecimal(raw.length, rng));
  for (let i = 0; i < 3; i++) raw.push(genPercentage(raw.length, rng));
  for (let i = 0; i < 2; i++) raw.push(genRatio(raw.length, rng));
  for (let i = 0; i < 2; i++) raw.push(genUnitConversion(raw.length, rng));
  for (let i = 0; i < 2; i++) raw.push(genRate(raw.length, rng));
  for (let i = 0; i < 2; i++) raw.push(genAverage(raw.length, rng));
  raw.push(genTableQuestion(raw.length, rng));
  raw.push(genBarChartQuestion(raw.length, rng));
  // shuffle and take 20
  for (let i = raw.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [raw[i], raw[j]] = [raw[j], raw[i]];
  }
  return raw.slice(0, 20).map((q, i) => ({ ...q, id: `num_${String(i+1).padStart(2,'0')}` }));
}

// ---- 1D. Abstract Reasoning ----

const SHAPES = {
  circle: (cx,cy,r,fill,stroke='#222') => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`,
  square: (cx,cy,r,fill,stroke='#222') => `<rect x="${cx-r}" y="${cy-r}" width="${r*2}" height="${r*2}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`,
  triangle: (cx,cy,r,fill,stroke='#222') => {
    const pts = [[cx,cy-r],[cx+r*0.866,cy+r*0.5],[cx-r*0.866,cy+r*0.5]].map(p=>p.join(',')).join(' ');
    return `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
  },
  diamond: (cx,cy,r,fill,stroke='#222') => {
    const pts = [[cx,cy-r],[cx+r,cy],[cx,cy+r],[cx-r,cy]].map(p=>p.join(',')).join(' ');
    return `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
  },
  cross: (cx,cy,r,fill,stroke='#222') => `<path d="M${cx-r} ${cy}h${r*2}M${cx} ${cy-r}v${r*2}" stroke="${stroke}" stroke-width="3" fill="none"/>`,
  hexagon: (cx,cy,r,fill,stroke='#222') => {
    const pts = Array.from({length:6},(_,i)=>{const a=i*60*Math.PI/180;return `${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`;}).join(' ');
    return `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
  },
  star: (cx,cy,r,fill,stroke='#222') => {
    let pts=''; for(let i=0;i<10;i++){const a=i*36*Math.PI/180,ri=i%2?r*0.4:r;pts+=`${cx+ri*Math.cos(a-Math.PI/2)},${cy+ri*Math.sin(a-Math.PI/2)} `;}
    return `<polygon points="${pts.trim()}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
  }
};

const SHAPE_KEYS = Object.keys(SHAPES);
const FILLS = ['none','#1f2937','#9ca3af','#60a5fa','#fbbf24'];

function renderFrame(spec) {
  const { shape, fill, rotation, scale, count } = spec;
  const r = Math.round(15 * (scale || 1));
  let inner = '';
  const fn = SHAPES[shape] || SHAPES.circle;
  if (count <= 1) {
    inner = fn(40, 40, r, fill);
  } else if (count === 2) {
    inner = fn(25, 40, r * 0.7, fill) + fn(55, 40, r * 0.7, fill);
  } else {
    inner = fn(25, 25, r * 0.6, fill) + fn(55, 25, r * 0.6, fill) + fn(40, 55, r * 0.6, fill);
  }
  const rotAttr = rotation ? ` transform="rotate(${rotation},40,40)"` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80"><rect width="80" height="80" fill="#f8f8f4" rx="4"/><g${rotAttr}>${inner}</g></svg>`;
}

function renderFrameSmall(spec) {
  const { shape, fill, rotation, scale, count } = spec;
  const r = Math.round(12 * (scale || 1));
  let inner = '';
  const fn = SHAPES[shape] || SHAPES.circle;
  if (count <= 1) {
    inner = fn(32, 32, r, fill);
  } else if (count === 2) {
    inner = fn(20, 32, r * 0.7, fill) + fn(44, 32, r * 0.7, fill);
  } else {
    inner = fn(20, 20, r * 0.6, fill) + fn(44, 20, r * 0.6, fill) + fn(32, 44, r * 0.6, fill);
  }
  const rotAttr = rotation ? ` transform="rotate(${rotation},32,32)"` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><rect width="64" height="64" fill="#f8f8f4" rx="4"/><g${rotAttr}>${inner}</g></svg>`;
}

let _absRng = lcg(42);
function resetAbsRng(seed) { _absRng = lcg(seed); }

// Guarantees the four answer options render to visually-distinct SVGs.
// specs[0] is always the correct option; only distractors (index >= 1) are
// perturbed. Because the duplicate check compares against ALL other options
// (including the correct one), the correct answer can never end up duplicated
// among the distractors.
function dedupeOptionSpecs(specs, renderFn) {
  for (let i = 1; i < specs.length; i++) {
    let guard = 0;
    while (guard < 60) {
      const rendered = specs.map(renderFn);
      const isDup = rendered.some((r, k) => k !== i && r === rendered[i]);
      if (!isDup) break;
      const s = specs[i];
      if (guard < FILLS.length) {
        s.fill = FILLS[(FILLS.indexOf(s.fill) + 1) % FILLS.length];
      } else if (guard < FILLS.length + SHAPE_KEYS.length) {
        s.shape = SHAPE_KEYS[(SHAPE_KEYS.indexOf(s.shape) + 1) % SHAPE_KEYS.length];
      } else {
        s.rotation = ((s.rotation || 0) + 30) % 360;
        s.count = ((s.count || 1) % 3) + 1;
      }
      guard++;
    }
  }
  return specs;
}

function genSequenceQuestion(idxStr) {
  const shape = SHAPE_KEYS[Math.floor(_absRng() * SHAPE_KEYS.length)];
  const fillSeq = FILLS.slice();
  const startFillIdx = Math.floor(_absRng() * FILLS.length);
  const rotStep = [0, 45, 90][Math.floor(_absRng() * 3)];
  const countStart = Math.floor(_absRng() * 2) + 1;
  const useCount = _absRng() > 0.5 && countStart < 3;
  const specs = [];
  for (let i = 0; i < 4; i++) {
    specs.push({
      shape,
      fill: fillSeq[(startFillIdx + i) % FILLS.length],
      rotation: rotStep * i,
      scale: 1,
      count: useCount ? countStart + i : 1
    });
  }
  const correctSpec = specs[3];
  const distSpecs = [
    { ...correctSpec, fill: fillSeq[(startFillIdx + 4) % FILLS.length] },
    { ...correctSpec, rotation: (correctSpec.rotation + 90) % 360 },
    { ...correctSpec, count: Math.max(1, (correctSpec.count || 1) - 1), fill: fillSeq[(startFillIdx + 2) % FILLS.length] }
  ];
  const allOpts = dedupeOptionSpecs([correctSpec, ...distSpecs], renderFrameSmall);
  // shuffle
  let ci = 0;
  for (let i = allOpts.length - 1; i > 0; i--) {
    const j = Math.floor(_absRng() * (i + 1));
    [allOpts[i], allOpts[j]] = [allOpts[j], allOpts[i]];
    if (j === ci) ci = i; else if (i === ci) ci = j;
  }
  const seqHtml = specs.slice(0,3).map((s,i) =>
    `<div class="seq-item">${renderFrame(s)}<div class="seq-label">${i+1}</div></div>`
  ).join('<div style="font-size:1.5rem;color:#888;align-self:center">→</div>') +
  '<div style="font-size:1.5rem;color:#888;align-self:center">→</div>' +
  `<div class="seq-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80"><rect width="80" height="80" fill="#e8e8e4" rx="4"/><text x="40" y="48" text-anchor="middle" font-size="32" fill="#999">?</text></svg><div class="seq-label">4</div></div>`;
  return {
    id: idxStr, module: 'abstract', type: 'mcq',
    prompt: `<p>What comes next in the sequence?</p><div class="seq-display">${seqHtml}</div>`,
    options: allOpts.map(s => renderFrameSmall(s)),
    correct: ci,
    explanation: `<p>The sequence follows: shape="${shape}", fill cycles through ${FILLS.join('→')}, rotation increases by ${rotStep}° each step${useCount ? ', count increases by 1' : ''}. The correct answer applies all of these rules to step 4.</p>`,
    hint: "Track each property separately: shape, fill, rotation, count.",
    commonMistake: "A common trap is matching only one property (e.g. the right shape) while ignoring rotation, fill or count.",
    svg: null, isAbstract: true
  };
}

function genMatrixQuestion(idxStr) {
  const shape = SHAPE_KEYS[Math.floor(_absRng() * SHAPE_KEYS.length)];
  const fills = [FILLS[Math.floor(_absRng() * FILLS.length)], FILLS[Math.floor(_absRng() * FILLS.length)], FILLS[Math.floor(_absRng() * FILLS.length)], FILLS[Math.floor(_absRng() * FILLS.length)]];
  const rowRots = [0, 90];
  const colRots = [0, 45];
  // 2x2 grid: [TL, TR, BL, BR(missing)]
  const specs = [
    { shape, fill: fills[0], rotation: rowRots[0] + colRots[0], scale: 1, count: 1 },
    { shape, fill: fills[1], rotation: rowRots[0] + colRots[1], scale: 1, count: 1 },
    { shape, fill: fills[2], rotation: rowRots[1] + colRots[0], scale: 1, count: 1 },
    { shape, fill: fills[3], rotation: rowRots[1] + colRots[1], scale: 1, count: 1 }
  ];
  const correctSpec = specs[3];
  const distSpecs = [
    { ...correctSpec, fill: FILLS[(FILLS.indexOf(correctSpec.fill) + 1) % FILLS.length] },
    { ...correctSpec, rotation: (correctSpec.rotation + 45) % 360 },
    { ...correctSpec, fill: fills[0], rotation: colRots[0] }
  ];
  const allOpts = dedupeOptionSpecs([correctSpec, ...distSpecs], renderFrameSmall);
  let ci = 0;
  for (let i = allOpts.length - 1; i > 0; i--) {
    const j = Math.floor(_absRng() * (i + 1));
    [allOpts[i], allOpts[j]] = [allOpts[j], allOpts[i]];
    if (j === ci) ci = i; else if (i === ci) ci = j;
  }
  const matrixHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;width:172px;margin:0.5rem 0">
    ${specs.slice(0,3).map(s => `<div>${renderFrame(s)}</div>`).join('')}
    <div><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80"><rect width="80" height="80" fill="#e8e8e4" rx="4"/><text x="40" y="48" text-anchor="middle" font-size="32" fill="#999">?</text></svg></div>
  </div>`;
  return {
    id: idxStr, module: 'abstract', type: 'mcq',
    prompt: `<p>Which option completes the matrix?</p>${matrixHtml}`,
    options: allOpts.map(s => renderFrameSmall(s)),
    correct: ci,
    explanation: `<p>Each row rotates by ${rowRots[1]}°; each column rotates by ${colRots[1]}°. The missing cell requires rotation=${correctSpec.rotation}° and fill="${correctSpec.fill}".</p>`,
    hint: "Find the rule across the row AND down the column.",
    commonMistake: "A common trap is following only the row pattern (or only the column) instead of combining both transformations.",
    svg: null, isAbstract: true
  };
}

function genOddOneOutQuestion(idxStr) {
  const shape = SHAPE_KEYS[Math.floor(_absRng() * SHAPE_KEYS.length)];
  let oddShape = SHAPE_KEYS[Math.floor(_absRng() * SHAPE_KEYS.length)];
  while (oddShape === shape) oddShape = SHAPE_KEYS[Math.floor(_absRng() * SHAPE_KEYS.length)];
  const fill = FILLS[Math.floor(_absRng() * FILLS.length)];
  const oddIdx = Math.floor(_absRng() * 5);
  const specs = Array.from({length:5}, (_,i) => ({
    shape: i === oddIdx ? oddShape : shape,
    fill, rotation: 0, scale: 1, count: 1
  }));
  const labels = ['A','B','C','D','E'];
  const svgOpts = specs.map((s,i) => {
    const sv = renderFrameSmall(s);
    return `<div style="text-align:center">${sv}<div style="font-size:0.85rem;font-weight:700;margin-top:2px">${labels[i]}</div></div>`;
  });
  const rowHtml = `<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin:0.5rem 0">${svgOpts.join('')}</div>`;
  return {
    id: idxStr, module: 'abstract', type: 'mcq',
    prompt: `<p>Which shape is the odd one out?</p>${rowHtml}`,
    options: labels,
    correct: oddIdx,
    explanation: `<p>Options ${labels.filter((_,i)=>i!==oddIdx).join(', ')} all show a <em>${shape}</em>. Option <strong>${labels[oddIdx]}</strong> shows a <em>${oddShape}</em> — making it the odd one out.</p>`,
    hint: "Find the property four of them share.",
    commonMistake: "A common trap is picking the figure that looks unusual at a glance rather than the one that breaks the shared rule.",
    svg: null, isAbstract: false
  };
}

function generateAbstractBank() {
  const seed = Date.now() ^ (Math.random() * 0xffffffff);
  resetAbsRng(seed);
  const questions = [];
  for (let i = 0; i < 8; i++) questions.push(genSequenceQuestion(`abs_${String(i+1).padStart(2,'0')}`));
  for (let i = 0; i < 7; i++) questions.push(genMatrixQuestion(`abs_${String(i+9).padStart(2,'0')}`));
  for (let i = 0; i < 5; i++) questions.push(genOddOneOutQuestion(`abs_${String(i+16).padStart(2,'0')}`));
  // shuffle
  const rng2 = lcg(seed + 1);
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(rng2() * (i + 1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  return questions.map((q, i) => ({ ...q, id: `abs_${String(i+1).padStart(2,'0')}` }));
}

// SECTION 2: TIMING

const MODULE_TIMES = { numeracy: 18*60, abstract: 15*60, safety: 12*60, mechanical: 10*60 };

let _timerInterval = null;

function startTimer(seconds, onTick, onExpire) {
  stopTimer();
  state.timerSecondsLeft = seconds;
  onTick(seconds);
  _timerInterval = setInterval(() => {
    state.timerSecondsLeft--;
    onTick(state.timerSecondsLeft);
    if (state.timerSecondsLeft <= 0) { stopTimer(); onExpire(); }
  }, 1000);
}

function stopTimer() {
  if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
}

function formatTime(s) {
  const absS = Math.max(0, s);
  const m = Math.floor(absS / 60);
  const sec = absS % 60;
  return { display: `${m}:${sec.toString().padStart(2,'0')}`, urgent: s <= 60 && s > 0 };
}

const state = {
  mode: 'exam',
  sessionModules: [],
  safetyTimerOn: true,
  questions: {},
  answers: {},
  flags: {},
  moduleStartTimes: {},
  moduleTimeTaken: {},
  currentModule: null,
  currentModuleIdx: 0,
  currentQIndex: 0,
  reviewMode: false,
  timerSecondsLeft: 0
};

let _hintShown = {};
let _sessionSaved = false;

function toggleHint(qId) {
  _hintShown[qId] = !_hintShown[qId];
  renderQuestionScreen();
}

function initSession(modules, mode) {
  _hintShown = {};
  _sessionSaved = false;
  state.mode = mode;
  state.sessionModules = modules;
  state.answers = {};
  state.flags = {};
  state.moduleStartTimes = {};
  state.moduleTimeTaken = {};
  state.questions = {};
  state.currentModuleIdx = 0;
  if (modules.includes('numeracy')) state.questions.numeracy = generateNumeracyBank();
  if (modules.includes('abstract')) state.questions.abstract = generateAbstractBank();
  if (modules.includes('safety')) state.questions.safety = SAFETY_QUESTIONS.slice();
  if (modules.includes('mechanical')) state.questions.mechanical = MECHANICAL_QUESTIONS.slice();
  startModule(modules[0]);
}

function startModule(key) {
  state.currentModule = key;
  state.currentQIndex = 0;
  state.reviewMode = false;
  state.moduleStartTimes[key] = Date.now();
  stopTimer();
  showScreen('screen-question');
  if (state.mode === 'exam') {
    const totalSecs = (key === 'safety' && !state.safetyTimerOn) ? null : MODULE_TIMES[key];
    if (totalSecs !== null) {
      startTimer(totalSecs, updateTimerDisplay, () => submitCurrentModule());
    }
  }
  renderQuestionScreen();
}

function submitCurrentModule() {
  stopTimer();
  const key = state.currentModule;
  state.moduleTimeTaken[key] = Math.round((Date.now() - state.moduleStartTimes[key]) / 1000);
  state.reviewMode = true;
  renderReviewScreen(key);
  showScreen('screen-review');
}

function advanceModule() {
  state.currentModuleIdx++;
  if (state.currentModuleIdx < state.sessionModules.length) {
    startModule(state.sessionModules[state.currentModuleIdx]);
  } else {
    stopTimer();
    saveSessionResult();
    renderResults();
    showScreen('screen-results');
  }
}

function scoreModule(key) {
  const qs = state.questions[key] || [];
  let correct = 0;
  qs.forEach(q => {
    if (state.answers[q.id] !== undefined && state.answers[q.id] === q.correct) correct++;
  });
  const total = qs.length;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  return { correct, total, pct, timeTaken: state.moduleTimeTaken[key] || 0 };
}

function scoreSession() {
  let totalCorrect = 0, totalQuestions = 0;
  state.sessionModules.forEach(key => {
    const s = scoreModule(key);
    totalCorrect += s.correct;
    totalQuestions += s.total;
  });
  const pct = totalQuestions > 0 ? Math.round(totalCorrect / totalQuestions * 100) : 0;
  const band = pct >= 80 ? 'Strong' : pct >= 65 ? 'Solid' : 'Keep Practising';
  return { totalCorrect, totalQuestions, pct, band };
}

function getCurrentQuestion() {
  const qs = state.questions[state.currentModule] || [];
  return qs[state.currentQIndex] || null;
}

function selectAnswer(qId, optIdx) {
  if (state.reviewMode) return;
  if (state.mode === 'practice' && state.answers[qId] !== undefined) return;
  state.answers[qId] = optIdx;
  renderQuestionScreen();
}

function toggleFlag(qId) {
  if (state.reviewMode) return;
  state.flags[qId] = !state.flags[qId];
  renderQuestionScreen();
}

function goNext() {
  const qs = state.questions[state.currentModule] || [];
  if (state.currentQIndex < qs.length - 1) {
    state.currentQIndex++;
    if (state.reviewMode) renderReviewJumpQuestion();
    else renderQuestionScreen();
  } else if (!state.reviewMode) {
    submitCurrentModule();
  }
}

function goPrev() {
  if (state.currentQIndex > 0) {
    state.currentQIndex--;
    if (state.reviewMode) renderReviewJumpQuestion();
    else renderQuestionScreen();
  }
}

function jumpToQuestion(idx) {
  state.currentQIndex = idx;
  state.reviewMode = true;
  showScreen('screen-question');
  renderReviewJumpQuestion();
}

function renderReviewJumpQuestion() {
  const q = getCurrentQuestion();
  if (!q) return;
  const qs = state.questions[state.currentModule] || [];
  renderQuestionScreen(true);
}

  updateModuleToggles();
}

window._selectedModules = ['numeracy', 'abstract', 'safety', 'mechanical'];

function updateModuleToggles() {
  ['numeracy','abstract','safety','mechanical'].forEach(k => {
    const el = document.getElementById(`mod-${k}`);
    if (!el) return;
    if (window._selectedModules.includes(k)) el.classList.add('active');
    else el.classList.remove('active');
  });
  const safetyRow = document.getElementById('safety-timer-row');
  if (safetyRow) {
    const show = window._selectedModules.includes('safety') || window._selectedModules.length === 4;
    safetyRow.style.display = show ? '' : 'none';
  }
}

function toggleModule(key) {
  const idx = window._selectedModules.indexOf(key);
  if (idx >= 0) {
    if (window._selectedModules.length > 1) window._selectedModules.splice(idx, 1);
  } else {
    window._selectedModules.push(key);
  }
  updateModuleToggles();
}

function setMode(m) {
  state.mode = m;
  document.querySelectorAll('.mode-btn').forEach((b,i) => {
    b.classList.toggle('active', (i === 0 && m === 'exam') || (i === 1 && m === 'practice'));
  });
}

function startFromHome() {
  const modules = ['numeracy','abstract','safety','mechanical'].filter(k => window._selectedModules.includes(k));
  const errEl = document.getElementById('home-error');
  if (modules.length === 0) {
    if (errEl) { errEl.textContent = 'Please select at least one module.'; errEl.style.display = 'block'; }

  if (errEl) errEl.style.display = 'none';

function renderQuestionScreen(fromReviewJump) {
  const q = getCurrentQuestion();
  if (!q) return;
  const qs = state.questions[state.currentModule] || [];
  const total = qs.length;
  const idx = state.currentQIndex;
  const isFlagged = !!state.flags[q.id];
  const hasAnswer = state.answers[q.id] !== undefined;
  const answered = state.answers[q.id];
  const moduleNames = { numeracy: 'Numeracy', abstract: 'Abstract Reasoning', safety: 'Safety Awareness', mechanical: 'Mechanical Reasoning' };
  const isReviewJump = state.reviewMode;

  const LETTERS = ['A','B','C','D','E'];
  let optionsHtml = '';
  if (q.isAbstract && Array.isArray(q.options) && q.options[0] && q.options[0].includes('<svg')) {
    optionsHtml = `<div class="abs-options-grid">`;
    q.options.forEach((opt, i) => {
      let cls = 'abs-option-btn';
      let icon = '';
      if (hasAnswer) {
        if (i === answered && i === q.correct) { cls += ' correct'; icon = ' ✓'; }
        else if (i === answered && i !== q.correct) { cls += ' incorrect'; icon = ' ✗'; }
        else if (i === q.correct && (isReviewJump || state.mode === 'practice')) { cls += ' correct'; icon = ' ✓'; }
        else if (i === answered) cls += ' selected';
      }
      const disabled = (state.mode === 'practice' && hasAnswer) || isReviewJump ? 'disabled' : '';
      optionsHtml += `<button class="${cls}" ${disabled} onclick="selectAnswer('${q.id}', ${i})">${opt}<span class="abs-badge">${LETTERS[i]}${icon}</span></button>`;
    });
    optionsHtml += `</div>`;
  } else {
    q.options.forEach((opt, i) => {
      let cls = 'option-btn';
      let icon = '';
      if (hasAnswer || isReviewJump) {
        if (i === answered && i === q.correct) { cls += ' correct'; icon = '✓'; }
        else if (i === answered && i !== q.correct) { cls += ' incorrect'; icon = '✗'; }
        else if (i === q.correct && (isReviewJump || state.mode === 'practice')) { cls += ' correct'; icon = '✓'; }
        else if (i === answered) cls += ' selected';
      }
      const disabled = (state.mode === 'practice' && hasAnswer) || isReviewJump ? 'disabled' : '';
      optionsHtml += `<button class="${cls}" ${disabled} onclick="selectAnswer('${q.id}', ${i})"><span class="opt-badge">${LETTERS[i]}</span><span class="opt-text">${opt}</span>${icon ? `<span class="opt-icon">${icon}</span>` : ''}</button>`;
    });
  }

  let feedbackHtml = '';
  if ((state.mode === 'practice' && hasAnswer) || isReviewJump) {
    const isCorrect = answered === q.correct;
    const feedClass = (answered === undefined) ? '' : (isCorrect ? '' : ' wrong');
    const mistakeHtml = q.commonMistake ? `<div class="mistake-line">⚠️ Common mistake: ${q.commonMistake}</div>` : '';
    if (answered !== undefined) {
      feedbackHtml = `<div class="feedback-box${feedClass}">
        <strong>${isCorrect ? '✓ Correct' : '✗ Incorrect'}</strong>
        ${q.explanation}
        ${mistakeHtml}
      </div>`;
    } else if (isReviewJump) {
      feedbackHtml = `<div class="feedback-box wrong"><strong>Not answered</strong>${q.explanation}${mistakeHtml}</div>`;
    }
  }

  // Hint (practice only, before answering)
  let hintHtml = '';
  if (state.mode === 'practice' && !hasAnswer && !isReviewJump && q.hint) {
    if (_hintShown[q.id]) {
      hintHtml = `<div class="hint-box">💡 ${q.hint}</div>`;
    } else {
      hintHtml = `<button class="hint-btn" onclick="toggleHint('${q.id}')">💡 Show hint</button>`;
    }
  }

  const pct = Math.round((idx + 1) / total * 100);
  const showTimer = state.mode === 'exam' && !isReviewJump && !(state.currentModule === 'safety' && !state.safetyTimerOn);
  const { display: tDisplay, urgent: tUrgent } = formatTime(state.timerSecondsLeft);

  document.getElementById('screen-question').innerHTML = `
    <div class="question-header">
      <div>
        <div class="module-label">${moduleNames[state.currentModule] || state.currentModule}</div>
        <div class="q-counter">Question ${idx+1} / ${total}</div>
      </div>
      <div style="text-align:right">
        ${showTimer ? `<div id="timer-display" class="timer${tUrgent?' urgent':''}" aria-live="polite">${tDisplay}</div>` : ''}
        ${isReviewJump ? '<span style="font-size:0.85rem;color:var(--muted)">Review Mode</span>' : ''}
      </div>
    </div>
    <div class="container" style="padding:1rem">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${pct}% complete</div>
      <div style="margin:1rem 0">
        <div>${q.svg ? q.svg : ''}</div>
        <div>${q.prompt}</div>
      </div>
      ${optionsHtml}
      ${hintHtml}
      ${feedbackHtml}
      <div class="nav-row">
        <button class="btn btn-ghost" onclick="goPrev()" ${idx===0?'disabled':''}>&#8592; Prev</button>
        ${!isReviewJump ? `<button class="flag-btn${isFlagged?' flagged':''}" onclick="toggleFlag('${q.id}')">&#9873; ${isFlagged?'Flagged':'Flag'}</button>` : ''}
        ${idx < total-1
          ? `<button class="btn btn-primary" onclick="goNext()">Next &#8594;</button>`
          : (!isReviewJump
              ? `<button class="btn btn-primary" onclick="submitCurrentModule()">Submit Module</button>`
              : `<button class="btn btn-ghost" onclick="showScreen('screen-review');renderReviewScreen(state.currentModule)">Back to Review</button>`)
        }
        ${isReviewJump ? `<button class="btn btn-ghost" onclick="showScreen('screen-review');renderReviewScreen(state.currentModule)">&#9776; Review Grid</button>` : ''}
      </div>
    </div>`;

const PROGRESS_KEY = 'brightspark_progress';

function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function saveSessionResult() {
  if (_sessionSaved) return;
  _sessionSaved = true;
  const perModule = {};
  state.sessionModules.forEach(key => { perModule[key] = scoreModule(key); });
  const overall = scoreSession();
  const entry = {
    date: new Date().toISOString(),
    mode: state.mode,
    perModule,
    overall: { correct: overall.totalCorrect, total: overall.totalQuestions, pct: overall.pct, band: overall.band }
  };
  let arr = loadProgress();
  arr.push(entry);
  if (arr.length > 50) arr = arr.slice(arr.length - 50);
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(arr)); } catch (e) {}
}

function clearProgress() {
  try { localStorage.removeItem(PROGRESS_KEY); } catch (e) {}
}

function sparkline(values) {
  if (!values || values.length === 0) return '<span style="color:var(--muted)">—</span>';
  const w = 120, h = 28, pad = 2;
  if (values.length === 1) {
    const y = h - pad - (values[0] / 100) * (h - 2 * pad);
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><circle cx="${w/2}" cy="${y}" r="3" fill="#1d4ed8"/></svg>`;
  }
  const step = (w - 2 * pad) / (values.length - 1);
  const pts = values.map((v, i) => {
    const x = pad + i * step;
    const y = h - pad - (Math.max(0, Math.min(100, v)) / 100) * (h - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function renderProgress() {
  const moduleNames = { numeracy: 'Numeracy', abstract: 'Abstract Reasoning', safety: 'Safety Awareness', mechanical: 'Mechanical Reasoning' };
  const history = loadProgress();
  const el = document.getElementById('screen-progress');

  if (history.length === 0) {
    el.innerHTML = `<div class="container" style="padding:2rem 1rem">
      <h1>Progress</h1>
      <div class="home-card empty-state">
        <p style="font-size:1.1rem;font-weight:600;color:var(--ink)">No history yet</p>
        <p>Complete a practice or exam session and your scores will be tracked here — best %, average %, and trends over time.</p>
        <button class="btn btn-primary" style="margin-top:0.5rem" onclick="renderHome();showScreen('screen-home')">Start a session</button>
      </div>
    </div>`;
    return;
  }

  // Per-module aggregates
  const moduleKeys = ['numeracy','abstract','safety','mechanical'];
  let moduleRows = '';
  moduleKeys.forEach(key => {
    const pcts = history.filter(h => h.perModule && h.perModule[key]).map(h => h.perModule[key].pct);
    if (pcts.length === 0) return;
    const best = Math.max(...pcts);
    const avg = Math.round(pcts.reduce((a,b)=>a+b,0) / pcts.length);
    moduleRows += `<div class="spark-row">
      <div style="min-width:160px"><strong>${moduleNames[key]}</strong><div style="font-size:0.8rem;color:var(--muted)">${pcts.length} session${pcts.length===1?'':'s'}</div></div>
      <div style="font-size:0.9rem">Best <strong>${best}%</strong> · Avg <strong>${avg}%</strong></div>
      <div title="Score trend">${sparkline(pcts)}</div>
    </div>`;
  });

  // Recent sessions (newest first)
  const recent = history.slice().reverse().slice(0, 15);
  let sessionRows = recent.map(h => {
    const d = new Date(h.date);
    const dateStr = isNaN(d) ? h.date : d.toLocaleString();
    const o = h.overall || { correct: 0, total: 0, pct: 0 };
    const bc = o.pct >= 80 ? 'band-strong' : o.pct >= 65 ? 'band-solid' : 'band-low';
    return `<tr><td>${dateStr}</td><td style="text-transform:capitalize">${h.mode || ''}</td><td>${o.correct}/${o.total}</td><td class="${bc}">${o.pct}%</td></tr>`;
  }).join('');

  el.innerHTML = `<div class="container" style="padding:2rem 1rem">
    <h1>Progress</h1>
    <p style="color:var(--muted);margin-bottom:1.5rem">Saved locally on this device (${history.length} session${history.length===1?'':'s'}).</p>
    <div class="home-card">
      <h3>Per-module performance</h3>
      ${moduleRows || '<p style="color:var(--muted)">No module data yet.</p>'}
    </div>
    <div class="home-card">
      <h3>Recent sessions</h3>
      <table><tr><th>Date</th><th>Mode</th><th>Score</th><th>%</th></tr>${sessionRows}</table>
    </div>
    <div style="margin-top:1rem">
      <button class="btn btn-danger" onclick="if(confirm('Clear all saved history?')){clearProgress();renderProgress();}">Clear history</button>
    </div>
  </div>`;
}

    title: 'Mechanical principles', icon: '⚙️',
    html: `
    <p><strong>Gears.</strong> Meshed gears turn in <em>opposite</em> directions. Speed is inverse to teeth.</p>
    <ul><li>Speed ratio = driver teeth ÷ driven teeth. <span class="eg">e.g. 8T driving 24T at 90 RPM → 90 × 8/24 = 30 RPM.</span></li><li>An idler gear between two gears reverses direction but does not change the overall ratio.</li></ul>
    <p><strong>Pulleys &amp; mechanical advantage (MA).</strong></p>
    <ul>
      <li>A single <em>fixed</em> pulley changes direction only — MA = 1, effort = load.</li>
      <li>Each <em>moving</em> pulley adds mechanical advantage (rope sections supporting the load). <span class="eg">One moving pulley → MA 2, effort = load ÷ 2.</span></li>
    </ul>
    <p><strong>Levers &amp; moments.</strong> Balance: load × distance = effort × distance.</p>
    <ul><li><span class="eg">e.g. 60 kg at 1 m balances 30 kg at 2 m.</span></li><li>Classes: 1st = fulcrum in the middle; 2nd = load in the middle (wheelbarrow); 3rd = effort in the middle (tweezers).</li></ul>
    <p><strong>Inclined plane.</strong> Force = weight × (height ÷ length). A longer ramp needs less force.</p>
    <ul><li><span class="eg">e.g. 1000 N up a 5 m ramp rising 1 m → 1000 × 1/5 = 200 N.</span></li></ul>
    <p><strong>Circuits.</strong></p>
    <ul>
      <li><strong>Series</strong> = one path; one break stops everything.</li>
      <li><strong>Parallel</strong> = independent paths; one break affects only its branch.</li>
      <li><strong>Switch logic:</strong> two switches in series = AND (both must be closed). Two in parallel = OR.</li>
    </ul>
    <p><strong>Hooke's law.</strong> Extension is proportional to force: F = k·x.</p>
    <ul><li><span class="eg">e.g. 20 N stretches 4 cm → k = 5 N/cm → 35 N stretches 7 cm.</span></li></ul>
    <p><strong>Ohm's law.</strong> V = I·R (voltage = current × resistance).</p>`
  },
  {
    title: 'Safety golden rules', icon: '🦺',
    html: `
    <p>Safety questions reward the <strong>people-before-schedule</strong> mindset. Choose the answer that protects people first, every time.</p>
    <ul>
      <li><strong>Never assume isolation — always test for dead.</strong> Verify with a tester before touching.</li>
      <li><strong>Lock-out / tag-out (LOTO):</strong> one lock per person; locks stay on until every worker removes their own.</li>
      <li><strong>PPE is non-negotiable</strong> — the correct gear, every time, no "quick" exceptions.</li>
      <li><strong>Stop-work authority:</strong> anyone can stop a job that is unsafe, regardless of rank.</li>
      <li><strong>Report near-misses</strong> formally — they reveal hazards before someone is hurt.</li>
      <li><strong>Hierarchy of control:</strong> eliminate → substitute → engineer → administrative → PPE (PPE is the last line).</li>
      <li><strong>Working at heights:</strong> use a harness; remove and tag out any shock-loaded gear.</li>
      <li><strong>Fatigue &amp; heat:</strong> recognise impairment and heat-stress signs; stop and get help.</li>
      <li><strong>People before schedule:</strong> time pressure never justifies skipping a safety control.</li>
      <li><strong>Dial before you dig:</strong> check plans, but treat any unexpected strike as live.</li>
    </ul>`
  }
];

function renderStudy() {
  const el = document.getElementById('screen-study');
  const sections = STUDY_CONTENT.map((s, i) => `
    <details class="study-section"${i === 0 ? ' open' : ''}>
      <summary>${s.icon} ${s.title}</summary>
      <div class="study-body">${s.html}</div>
    </details>`).join('');
  el.innerHTML = `<div class="container" style="padding:2rem 1rem">
    <h1>Study &amp; Reference Guide</h1>
    <p style="color:var(--muted);margin-bottom:1.5rem">Everything you need to revise before the test. Tap a section to expand.</p>
    ${sections}
    <div style="margin-top:1.5rem">
      <button class="btn btn-primary" onclick="renderHome();showScreen('screen-home')">Back to Home</button>
    </div>
  </div>`;
}

// ============================================================
// KEYBOARD HANDLING
// ============================================================

document.addEventListener('keydown', e => {
  const activeScreen = Array.from(document.querySelectorAll('.screen')).find(s => s.style.display !== 'none');
  if (!activeScreen || activeScreen.id !== 'screen-question') return;
  if (state.reviewMode) {
    if (e.key === 'ArrowRight' || e.key === 'Enter') goNext();
    if (e.key === 'ArrowLeft') goPrev();
    return;
  }
  const q = getCurrentQuestion();
  if (!q) return;
  if (e.key === '1') selectAnswer(q.id, 0);
  if (e.key === '2') selectAnswer(q.id, 1);
  if (e.key === '3') selectAnswer(q.id, 2);
  if (e.key === '4') selectAnswer(q.id, 3);
  if (e.key === 'ArrowRight' || e.key === 'Enter') goNext();
  if (e.key === 'ArrowLeft') goPrev();
  if (e.key === 'f' || e.key === 'F') toggleFlag(q.id);
});

// ============================================================
// INIT
// ============================================================
renderHome();
showScreen('screen-home');
</script>
</body>
</html>
